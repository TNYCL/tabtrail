[package]
name = "tabtrail"
version = "0.1.0"
edition = "2024"
# File::lock/try_lock (used for concurrency-safe cache writes) are stable since 1.89.
rust-version = "1.89"
authors = ["TNYCL <tunaycl@outlook.com>"]
description = "Discovery-based dynamic Tab completion for existing Bash, Zsh and Fish shells on Linux"
license = "MIT OR Apache-2.0"
repository = "https://github.com/TNYCL/tabtrail"
readme = "README.md"
keywords = ["completion", "shell", "bash", "zsh", "fish"]
categories = ["command-line-utilities"]
# crates.io publication is deferred by the owner; scripts/check-release-policy.sh
# (run in CI) fails if this is removed without changing that policy.
publish = false
include = [
    "/src/**",
    "/shell/**",
    "/tests/**",
    "/Cargo.toml",
    "/Cargo.lock",
    "/README.md",
    "/CHANGELOG.md",
    "/RELEASING.md",
    "/docs/**",
    # Project license texts (LICENSE-MIT, LICENSE-APACHE).
    "/LICENSE*",
    "/LICENCE*",
    "/COPYING*",
]

[dependencies]
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
rustix = { version = "1.1.5", default-features = false, features = ["std", "process", "fs"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
