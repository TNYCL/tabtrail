name: Release

# Builds, packages and verifies release artifacts.
#
# * Tag push (`v*`): builds the tagged commit; publication (draft GitHub
#   release, crates.io) is opt-in and fail-closed:
#     - repository variables TABTRAIL_GITHUB_RELEASE / TABTRAIL_CRATES_PUBLISH
#       must be 'true',
#     - the protected environments `release` / `crates-io` must approve,
#     - scripts/release-gate.sh must pass (license texts, notices, maintainer).
#   crates.io uses the `CARGO_REGISTRY_TOKEN` secret of the `crates-io`
#   environment when it is set (first release only), otherwise trusted
#   publishing (OIDC).
# * Manual run (workflow_dispatch): build-only release candidate for the
#   selected branch/ref. `version` is a *candidate* version string checked
#   against Cargo.toml, Cargo.lock and CHANGELOG.md; no Git tag needs to
#   exist and none is created. Manual runs never publish anything; their
#   `release-files` artifact can be attached to an existing draft release by
#   hand.
#
# Every job checks out the immutable commit `github.sha` (the tagged commit
# for a tag push, the selected ref's commit at dispatch time).
# See RELEASING.md.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Candidate version tag to validate, e.g. v0.1.0 (no Git tag required; build-only, never published)"
        required: true

permissions:
  contents: read

concurrency:
  group: release-${{ github.sha }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always
  # Toolchain for release binaries: packaging/notices/STATIC-RUNTIME-NOTICES.txt
  # is generated for this exact rustc commit (scripts/fetch-runtime-notices.sh);
  # package.sh refuses to package musl binaries built by any other rustc.
  RELEASE_TOOLCHAIN: "1.99.0"
  # Tag push: the pushed tag. Manual run: the candidate version string.
  TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}

jobs:
  verify:
    name: verify tag and sources
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy && rustup default stable
      - name: Checked-out commit is the pinned commit
        run: test "$(git rev-parse HEAD)" = "${{ github.sha }}"
      - name: Version (tag or candidate) matches Cargo.toml, Cargo.lock and CHANGELOG
        run: scripts/check-version.sh "$TAG"
      - name: Publication policy (GitHub and crates.io gates must pass)
        run: scripts/check-release-policy.sh
      - run: cargo fmt --check
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo test --all-targets --all-features --locked

  build:
    name: build ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
            deb: amd64
            rpm: x86_64
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
            deb: arm64
            rpm: aarch64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Toolchain (pinned release toolchain)
        run: |
          rustup toolchain install "$RELEASE_TOOLCHAIN" --profile minimal --component rust-docs --target "${{ matrix.target }}"
          rustup default "$RELEASE_TOOLCHAIN"
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq rpm file cpio
      - run: cargo build --release --locked --target "${{ matrix.target }}"
      - name: Package
        run: |
          SOURCE_DATE_EPOCH=$(git log -1 --format=%ct) \
            scripts/package.sh "${{ matrix.target }}" "target/${{ matrix.target }}/release/tabtrail" dist
      - name: Smoke test on the build architecture (license texts and maintainer in every package)
        run: |
          scripts/smoke-test.sh dist/tabtrail-*-"${{ matrix.target }}".tar.gz \
            dist/tabtrail_*_"${{ matrix.deb }}".deb dist/tabtrail-*."${{ matrix.rpm }}".rpm
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          # Per-target checksum files are regenerated over all artifacts later.
          path: |
            dist/*
            !dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

  checksums:
    name: combined checksums
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: SHA256SUMS
        run: |
          cd dist
          find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\n' | LC_ALL=C sort | xargs -r sha256sum > ../SHA256SUMS
          mv ../SHA256SUMS .
          cat SHA256SUMS
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: dist/*
          if-no-files-found: error
          retention-days: 30

  clean-install:
    name: clean install (${{ matrix.image }})
    needs: checksums
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    container: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image: ["ubuntu:24.04", "debian:trixie", "fedora:latest"]
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist
      - name: Verify checksums and install the native package
        run: |
          cd dist && sha256sum --check SHA256SUMS && cd ..
          # Notices are checked inside the package file: minimal images (e.g.
          # Ubuntu's) exclude /usr/share/doc from installation.
          if command -v dpkg >/dev/null; then
            contents=$(dpkg-deb --contents dist/tabtrail_*_amd64.deb)
            dpkg -i dist/tabtrail_*_amd64.deb
            licenses=share/doc/tabtrail
          else
            contents=$(rpm -qlp dist/tabtrail-*.x86_64.rpm)
            rpm -i dist/tabtrail-*.x86_64.rpm
            licenses=share/licenses/tabtrail
          fi
          grep -q 'share/doc/tabtrail/THIRD-PARTY-NOTICES.txt$' <<<"$contents"
          grep -q 'share/doc/tabtrail/notices/rust-toolchain/' <<<"$contents"
          grep -q "$licenses/LICENSE-MIT\$" <<<"$contents"
          grep -q "$licenses/LICENSE-APACHE\$" <<<"$contents"
          tabtrail --version
      - name: Install and remove shell integration in a temporary HOME
        run: |
          HOME=$(mktemp -d)
          export HOME
          printf '# user line\n' > "$HOME/.bashrc"
          before=$(sha256sum < "$HOME/.bashrc")
          tabtrail install --shell bash
          grep -qx '# >>> tabtrail initialize >>>' "$HOME/.bashrc"
          tabtrail uninstall --shell bash
          test "$(sha256sum < "$HOME/.bashrc")" = "$before"

  github-release:
    name: draft GitHub release (gated)
    needs: [checksums, clean-install]
    if: github.event_name == 'push' && vars.TABTRAIL_GITHUB_RELEASE == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Publication gate (license, configuration)
        run: scripts/release-gate.sh github
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist
      - name: Create draft release with artifacts and checksums
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd dist && sha256sum --check SHA256SUMS && cd ..
          # Never create a second release for the same tag (e.g. a draft that
          # was prepared by hand from a build-only candidate).
          existing=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.tag_name == \"$TAG\") | .id")
          if [[ -n $existing ]]; then
            echo "::error::a release for $TAG already exists (id $existing); update it instead of creating a duplicate draft"
            exit 1
          fi
          version=${TAG#v}
          {
            echo "> **Draft created by the release workflow — review before publishing.**"
            echo "> Confirm that the license texts (LICENSE-MIT, LICENSE-APACHE), package"
            echo "> maintainer/contact metadata and runtime notices inside the attached"
            echo "> artifacts are the final ones. If any"
            echo "> of them changed after this tag was built, update them, tag a new version"
            echo "> and let the workflow rebuild the packages instead of publishing this draft."
            echo
            awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md
          } > notes.md
          gh release create "$TAG" --draft --verify-tag --title "Tabtrail $version" --notes-file notes.md dist/*

  crates-io:
    name: publish to crates.io (gated)
    needs: github-release
    if: github.event_name == 'push' && vars.TABTRAIL_CRATES_PUBLISH == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: crates-io
    permissions:
      contents: read
      id-token: write # crates.io trusted publishing (OIDC)
    env:
      # A token is needed once, for the very first release (trusted publishing
      # works only for crates that already exist); afterwards trusted publishing.
      HAS_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.sha }}
      - name: Publication gate (license, notices, maintainer, no publish = false)
        run: scripts/release-gate.sh crates
      - name: Toolchain
        run: rustup toolchain install stable --profile minimal && rustup default stable
      - run: cargo publish --locked --dry-run
      - name: Trusted publishing token
        id: auth
        if: env.HAS_TOKEN != 'true'
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
